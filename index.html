<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PHỤ KIỆN HOÀNG ĐẾ - Quản lý Thị trường & Sales</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <div id="app" class="flex-1 flex flex-col"></div>

    <!-- MODAL CHỤP ẢNH CHECK-IN -->
    <div id="photo-modal" class="fixed inset-0 bg-slate-950/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-900 text-sm sm:text-base"><i class="fa-solid fa-camera text-amber-600 mr-2"></i>Xác thực Check-in cửa hàng</h3>
                <button onclick="closePhotoModal()" class="text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <div class="relative bg-slate-900 rounded-2xl overflow-hidden aspect-video flex items-center justify-center">
                    <video id="camera-stream" autoplay playsinline class="w-full h-full object-cover"></video>
                    <canvas id="camera-canvas" class="hidden"></canvas>
                    <div id="camera-placeholder" class="absolute text-slate-400 text-xs text-center p-4">Đang khởi động camera...</div>
                </div>
                <div id="photo-preview-container" class="hidden space-y-2">
                    <p class="text-xs font-semibold text-slate-600">Ảnh thực tế tại điểm bán:</p>
                    <img id="photo-preview" class="w-full rounded-xl object-cover aspect-video border" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ghi chú thăm cửa hàng</label>
                    <input type="text" id="checkin-note" class="w-full px-4 py-3 rounded-xl border text-sm focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="VD: Đã kiểm hàng, lên đơn phụ kiện...">
                </div>
            </div>
            <div class="flex flex-col gap-2 pt-2">
                <button id="btn-capture" onclick="capturePhoto()" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl text-xs transition"><i class="fa-solid fa-camera mr-1"></i>Chụp ảnh</button>
                <button id="btn-retake" onclick="startCamera()" class="hidden w-full py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition">Chụp lại</button>
                <button id="btn-submit-checkin" onclick="confirmCheckin()" disabled class="w-full py-3 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs opacity-50 cursor-not-allowed transition shadow-lg shadow-amber-500/30">Bắt đầu tính giờ (Check-in)</button>
            </div>
        </div>
    </div>

    <!-- MODAL ADMIN THÊM ĐIỂM BÁN THỦ CÔNG -->
    <div id="add-store-modal" class="fixed inset-0 bg-slate-950/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-5 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-900 text-sm sm:text-base"><i class="fa-solid fa-store text-amber-600 mr-2"></i>Thêm điểm bán mới (Admin)</h3>
                <button onclick="document.getElementById('add-store-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleAdminAddStore(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên cửa hàng *</label>
                    <input type="text" id="store-name" required class="w-full px-4 py-3 rounded-xl border text-sm" placeholder="VD: Phụ kiện Minh Phát">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên chủ cửa hàng</label>
                        <input type="text" id="store-owner" class="w-full px-4 py-3 rounded-xl border text-sm" placeholder="VD: Anh Minh">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Số điện thoại</label>
                        <input type="text" id="store-phone" class="w-full px-4 py-3 rounded-xl border text-sm" placeholder="VD: 0988xxxxxx">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Thành phố *</label>
                        <input type="text" id="store-city" required value="Thành phố Thái Bình" class="w-full px-4 py-3 rounded-xl border text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Quận / Huyện *</label>
                        <input type="text" id="store-district" required value="TP. Thái Bình" class="w-full px-4 py-3 rounded-xl border text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Địa chỉ chi tiết *</label>
                    <input type="text" id="store-address" required class="w-full px-4 py-3 rounded-xl border text-sm" placeholder="Số nhà, tên đường...">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Vĩ độ (Lat) *</label>
                        <input type="number" step="any" id="store-lat" required value="20.4464" class="w-full px-4 py-3 rounded-xl border text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kinh độ (Lng) *</label>
                        <input type="number" step="any" id="store-lng" required value="106.3364" class="w-full px-4 py-3 rounded-xl border text-sm">
                    </div>
                </div>
                <div class="pt-2 flex flex-col sm:flex-row gap-2">
                    <button type="button" onclick="autoFillCurrentGPS()" class="w-full sm:w-auto px-4 py-3 bg-emerald-50 text-emerald-700 font-semibold rounded-xl text-xs hover:bg-emerald-100 transition"><i class="fa-solid fa-crosshairs mr-1"></i>Lấy GPS hiện tại</button>
                    <button type="submit" class="flex-1 py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl text-xs transition">Lưu điểm bán mới</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- DATABASE & STATE ---
        let db = JSON.parse(localStorage.getItem('hoangde_master_db_v13')) || {
            users: [
                { username: 'admin', password: '123', role: 'admin', status: 'approved', fullname: 'Quản trị viên (Hoàng Đế)' }
            ],
            stores: [
                { id: 1, name: 'Cửa hàng Phụ kiện Minh Phát', owner: 'Anh Minh', phone: '0901234567', city: 'Thành phố Thái Bình', district: 'TP. Thái Bình', lat: 20.4464, lng: 106.3364, address: 'Số 10 Lê Thánh Tông', visited: false, note: '', photo: '', checkinTime: null },
                { id: 2, name: 'Đại lý 368 Mobile', owner: 'Chị Lan', phone: '0988765432', city: 'Thành phố Thái Bình', district: 'TP. Thái Bình', lat: 20.4500, lng: 106.3400, address: 'Số 25 Lý Bôn', visited: true, note: 'Đã ghé, nhập hàng phụ kiện', photo: '', checkinTime: null },
                { id: 3, name: 'Cửa hàng Hoàng Long', owner: 'Anh Long', phone: '0912345678', city: 'Huyện lân cận', district: 'Huyện Kiến Xương', lat: 20.3800, lng: 106.3800, address: 'Khu 2 Thị trấn Kiến Xương', visited: false, note: '', photo: '', checkinTime: null }
            ],
            history: [],
            settings: { checkinRadius: 50, requiredMinutes: 5 }
        };

        let currentUsername = localStorage.getItem('hoangde_current_username_v13') || null;
        let currentTab = 'stores', selectedCity = 'all', selectedDistrict = 'all';
        let authMode = 'login';
        let currentLivePos = { lat: 20.4464, lng: 106.3364 };
        let activeCheckinStoreId = null, capturedImageData = null, mediaStream = null;

        function getCurrentUser() {
            if (!currentUsername) return null;
            return db.users.find(u => u.username === currentUsername) || null;
        }

        function saveData() {
            localStorage.setItem('hoangde_master_db_v13', JSON.stringify(db));
            if(currentUsername) localStorage.setItem('hoangde_current_username_v13', currentUsername);
            else localStorage.removeItem('hoangde_current_username_v13');
        }

        function resetSystem() {
            if(confirm('Thao tác này sẽ làm mới toàn bộ dữ liệu hệ thống về mặc định. Bạn có chắc không?')) {
                localStorage.clear();
                location.reload();
            }
        }

        // --- ROUTER & RENDER ---
        function render() {
            const app = document.getElementById('app');
            const user = getCurrentUser();

            if (!user) {
                app.innerHTML = renderAuthScreen();
                return;
            }
            if (user.status !== 'approved' && user.role !== 'admin') {
                app.innerHTML = renderPendingScreen();
                return;
            }
            app.innerHTML = renderMainLayout();
        }

        // --- AUTH SCREENS ---
        function renderAuthScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950">
                    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 sm:p-8 border border-slate-100">
                        <div class="text-center mb-6">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-amber-500 text-slate-950 rounded-2xl text-2xl font-bold mb-3 shadow-lg shadow-amber-500/30">
                                <i class="fa-solid fa-crown"></i>
                            </div>
                            <h1 class="text-xl sm:text-2xl font-black text-slate-900 uppercase tracking-wide">PHỤ KIỆN HOÀNG ĐẾ</h1>
                            <p class="text-xs font-semibold text-slate-500 mt-1 uppercase tracking-wider">Hệ thống Quản lý Thị trường & Sales</p>
                        </div>

                        <div class="flex rounded-xl bg-slate-100 p-1 mb-6">
                            <button onclick="authMode='login'; render();" class="flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition ${authMode==='login'?'bg-white text-amber-600 shadow-sm':'text-slate-600'}">Đăng nhập</button>
                            <button onclick="authMode='register'; render();" class="flex-1 py-2.5 text-xs sm:text-sm font-semibold rounded-lg transition ${authMode==='register'?'bg-white text-amber-600 shadow-sm':'text-slate-600'}">Đăng ký mới</button>
                        </div>

                        ${authMode === 'login' ? `
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên đăng nhập</label>
                                    <input type="text" id="login-user" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm" placeholder="Nhập tài khoản (admin)...">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mật khẩu</label>
                                    <input type="password" id="login-pass" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm" placeholder="••••••••">
                                </div>
                                <button type="submit" class="w-full py-3.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-amber-500/30">Đăng nhập hệ thống</button>
                            </form>
                        ` : `
                            <form onsubmit="handleRegister(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Họ và tên</label>
                                    <input type="text" id="reg-name" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" placeholder="Nguyễn Văn A">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tên đăng nhập</label>
                                    <input type="text" id="reg-user" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" placeholder="username...">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Mật khẩu</label>
                                    <input type="password" id="reg-pass" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm" placeholder="••••••••">
                                </div>
                                <button type="submit" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl transition">Đăng ký tài khoản</button>
                            </form>
                        `}
                        
                        <div class="mt-6 text-center border-t border-slate-100 pt-4">
                            <button onclick="resetSystem()" class="text-xs text-rose-500 hover:underline font-semibold"><i class="fa-solid fa-rotate-right mr-1"></i>Reset lại hệ thống (Xóa lỗi bộ nhớ)</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPendingScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4">
                    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-6 sm:p-8 text-center border border-slate-100">
                        <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4">
                            <i class="fa-solid fa-clock-rotate-left"></i>
                        </div>
                        <h2 class="text-lg sm:text-xl font-bold text-slate-900">Tài khoản đang chờ duyệt</h2>
                        <p class="text-xs sm:text-sm text-slate-500 mt-2">Tài khoản của bạn đã được đăng ký thành công hệ thống **PHỤ KIỆN HOÀNG ĐẾ**, vui lòng chờ Quản trị viên phê duyệt.</p>
                        <button onclick="currentUsername=null; saveData(); render();" class="mt-6 px-6 py-3 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-xs sm:text-sm transition">Đăng nhập tài khoản khác</button>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value.trim();
            const found = db.users.find(x => x.username === u && x.password === p);
            if (!found) { alert('Sai tên đăng nhập hoặc mật khẩu!'); return; }
            currentUsername = found.username;
            saveData();
            render();
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value.trim();
            if (db.users.some(x => x.username === u)) { alert('Tên đăng nhập này đã tồn tại!'); return; }
            db.users.push({ username: u, password: p, role: 'sale', status: 'pending', fullname: name });
            saveData();
            alert('Đăng ký thành công! Vui lòng chờ Admin duyệt.');
            authMode = 'login';
            render();
        }

        function logout() { currentUsername = null; saveData(); render(); }

        // --- MAIN APP LAYOUT ---
        function renderMainLayout() {
            const user = getCurrentUser();
            const isAdmin = user.role === 'admin';
            const pendingCount = db.users.filter(x => x.status === 'pending').length;

            return `
                <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 px-4 sm:px-6 py-3.5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 shadow-md">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 sm:w-10 sm:h-10 bg-amber-500 text-slate-950 rounded-xl flex items-center justify-center font-black text-base shadow flex-shrink-0">
                            <i class="fa-solid fa-crown"></i>
                        </div>
                        <div>
                            <h1 class="font-black text-white text-xs sm:text-sm tracking-wide uppercase">PHỤ KIỆN HOÀNG ĐẾ</h1>
                            <p class="text-[11px] sm:text-xs text-slate-400">Nhân sự: <span class="font-semibold text-amber-400">${user.fullname}</span></p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                        <button onclick="requestUserGPS()" class="px-3 py-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded-xl text-xs font-semibold flex items-center space-x-1 transition">
                            <i class="fa-solid fa-crosshairs"></i>
                            <span id="gps-btn-text">Lấy GPS</span>
                        </button>
                        <button onclick="logout()" class="px-3 py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-semibold flex items-center space-x-1 transition">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            <span>Thoát</span>
                        </button>
                    </div>
                </header>

                <div class="bg-white border-b border-slate-200 px-4 sm:px-6 flex space-x-4 sm:space-x-6 overflow-x-auto shadow-sm">
                    <button onclick="currentTab='stores'; render();" class="py-3 text-xs sm:text-sm font-semibold border-b-2 whitespace-nowrap transition ${currentTab==='stores'?'border-amber-500 text-amber-600':'border-transparent text-slate-500'}">
                        <i class="fa-solid fa-store mr-1.5"></i> Điểm bán (${db.stores.length})
                    </button>
                    <button onclick="currentTab='history'; render();" class="py-3 text-xs sm:text-sm font-semibold border-b-2 whitespace-nowrap transition ${currentTab==='history'?'border-amber-500 text-amber-600':'border-transparent text-slate-500'}">
                        <i class="fa-solid fa-route mr-1.5"></i> Lịch sử (${db.history.length})
                    </button>
                    ${isAdmin ? `
                        <button onclick="currentTab='admin'; render();" class="py-3 text-xs sm:text-sm font-semibold border-b-2 whitespace-nowrap transition relative ${currentTab==='admin'?'border-amber-500 text-amber-600':'border-transparent text-slate-500'}">
                            <i class="fa-solid fa-shield-halved mr-1.5"></i> Quản trị
                            ${pendingCount > 0 ? `<span class="absolute top-2 -right-3 px-1.5 py-0.5 bg-rose-500 text-white rounded-full text-[10px]">${pendingCount}</span>` : ''}
                        </button>
                    ` : ''}
                </div>

                <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
                    ${currentTab === 'stores' ? renderStoresView() : currentTab === 'history' ? renderHistoryView() : renderAdminView()}
                </main>
            `;
        }

        // --- STORES VIEW & GỢI Ý TUYẾN ĐƯỜNG ---
        function renderStoresView() {
            const user = getCurrentUser();
            const isAdmin = user.role === 'admin';
            const cities = [...new Set(db.stores.map(s => s.city))];
            const districts = selectedCity === 'all' ? [...new Set(db.stores.map(s => s.district))] : [...new Set(db.stores.filter(s => s.city === selectedCity).map(s => s.district))];
            
            let filteredStores = db.stores.filter(s => (selectedCity==='all'||s.city===selectedCity) && (selectedDistrict==='all'||s.district===selectedDistrict));
            filteredStores.forEach(s => { s.calculatedDistance = calculateDistance(currentLivePos.lat, currentLivePos.lng, s.lat, s.lng); });
            filteredStores.sort((a, b) => a.calculatedDistance - b.calculatedDistance);

            return `
                <div class="space-y-4 sm:space-y-6">
                    <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="font-bold text-slate-900 text-base sm:text-lg flex items-center space-x-2">
                                <span>Tuyến đường thông minh</span>
                                <span class="text-[11px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-semibold">Gần nhất</span>
                            </h2>
                            <p class="text-xs sm:text-sm text-slate-500 mt-1">Sắp xếp tự động theo GPS, yêu cầu đủ 5 phút check-out.</p>
                        </div>
                        ${isAdmin ? `
                            <button onclick="openAdminAddStoreModal()" class="w-full sm:w-auto px-4 py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl text-xs transition shadow-lg shadow-amber-500/30 flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-plus"></i>
                                <span>Thêm điểm bán (Admin)</span>
                            </button>
                        ` : ''}
                    </div>

                    <!-- BỘ LỌC -->
                    <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Tỉnh / Thành phố</label>
                            <select id="filter-city" onchange="selectedCity=this.value; selectedDistrict='all'; render();" class="w-full px-3 py-2.5 rounded-xl border text-sm">
                                <option value="all">-- Tất cả Thành phố --</option>
                                ${cities.map(c => `<option value="${c}" ${selectedCity===c?'selected':''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 mb-1">Quận / Huyện</label>
                            <select id="filter-district" onchange="selectedDistrict=this.value; render();" class="w-full px-3 py-2.5 rounded-xl border text-sm">
                                <option value="all">-- Tất cả Quận / Huyện --</option>
                                ${districts.map(d => `<option value="${d}" ${selectedDistrict===d?'selected':''}>${d}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <!-- DANH SÁCH ĐIỂM BÁN -->
                    <div class="space-y-4">
                        ${filteredStores.length === 0 ? `<div class="bg-white p-10 text-center rounded-2xl border text-slate-400 text-sm">Không tìm thấy điểm bán nào.</div>` : ''}
                        ${filteredStores.map((s, index) => {
                            const distance = s.calculatedDistance;
                            const canCheckin = distance <= db.settings.checkinRadius;
                            const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`;
                            const isCheckedIn = s.checkinTime !== null;
                            const elapsedMinutes = isCheckedIn ? Math.floor((Date.now() - s.checkinTime) / 60000) : 0;
                            const canCheckout = elapsedMinutes >= db.settings.requiredMinutes;

                            return `
                                <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200 hover:border-amber-400 transition space-y-3">
                                    <div class="flex items-start justify-between gap-2">
                                        <div class="flex items-start space-x-3">
                                            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center font-black text-xs sm:text-sm shadow flex-shrink-0 mt-0.5">
                                                #${index + 1}
                                            </div>
                                            <div>
                                                <h3 class="font-bold text-slate-900 text-sm sm:text-base">${s.name}</h3>
                                                <p class="text-xs text-slate-500 mt-0.5">Chủ: <b class="text-slate-700">${s.owner || 'N/A'}</b> | SĐT: <a href="tel:${s.phone}" class="text-blue-600 underline">${s.phone || 'N/A'}</a></p>
                                                <p class="text-xs text-slate-500 mt-0.5"><i class="fa-solid fa-location-dot mr-1 text-amber-600"></i>${s.address}, ${s.district} <span class="text-[10px] text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded font-mono">[${s.lat}, ${s.lng}]</span></p>
                                            </div>
                                        </div>
                                        <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap ${s.visited?'bg-emerald-100 text-emerald-700':isCheckedIn?'bg-blue-100 text-blue-700 animate-pulse':'bg-amber-100 text-amber-700'}">
                                            ${s.visited?'Hoàn thành':isCheckedIn?`Đang làm (${elapsedMinutes}p)`:'Chưa ghé'}
                                        </span>
                                    </div>

                                    ${isCheckedIn && !s.visited ? `
                                        <div class="bg-blue-50 border border-blue-200 p-3 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-blue-800">
                                            <span><i class="fa-solid fa-stopwatch mr-1"></i>Đang ở điểm bán (${elapsedMinutes}/${db.settings.requiredMinutes} phút).</span>
                                            <button onclick="doCheckout(${s.id})" ${canCheckout?'':'disabled'} class="w-full sm:w-auto px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg ${canCheckout?'':'opacity-50 cursor-not-allowed'}">
                                                ${canCheckout?'Bấm Check-out':'Đang tính giờ...'}
                                            </button>
                                        </div>
                                    ` : ''}

                                    ${s.visited && s.note ? `
                                        <div class="text-xs bg-slate-50 p-3 rounded-xl text-slate-700 space-y-2">
                                            <div><b>Ghi chú:</b> ${s.note}</div>
                                            ${s.photo ? `<div><img src="${s.photo}" class="w-28 h-16 object-cover rounded-lg border shadow-sm" /></div>` : ''}
                                        </div>
                                    ` : ''}

                                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between pt-3 border-t border-slate-100 gap-3">
                                        <span class="text-xs font-semibold ${canCheckin?'text-emerald-600':'text-rose-600'}">
                                            <i class="fa-solid fa-ruler mr-1"></i>Cách bạn: ~${Math.round(distance)}m (${canCheckin?'Đủ điều kiện':'Quá xa'})
                                        </span>
                                        <div class="grid grid-cols-2 sm:flex items-center gap-1.5 w-full sm:w-auto">
                                            <a href="${googleMapUrl}" target="_blank" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-xs text-center inline-flex items-center justify-center">
                                                <i class="fa-solid fa-map mr-1 text-blue-600"></i> Bản đồ
                                            </a>
                                            <button onclick="navigateGoogleMaps(${s.lat}, ${s.lng})" class="px-3 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold rounded-lg text-xs text-center">
                                                <i class="fa-solid fa-diamond-turn-right mr-1"></i> Đường
                                            </button>
                                            ${!s.visited && !isCheckedIn ? `
                                                <button onclick="openCheckinModal(${s.id})" class="col-span-2 sm:col-span-1 px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg text-xs transition shadow ${canCheckin?'':'opacity-50'}">
                                                    <i class="fa-solid fa-camera mr-1"></i> Check-in ảnh
                                                </button>
                                            ` : ''}
                                            ${isAdmin ? `
                                                <button onclick="deleteStore(${s.id})" class="px-3 py-2 bg-rose-50 text-rose-600 rounded-lg text-xs text-center">
                                                    <i class="fa-solid fa-trash"></i>
                                                </button>
                                            ` : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // --- LỊCH SỬ ĐI TUYẾN ---
        function renderHistoryView() {
            return `
                <div class="space-y-4 sm:space-y-6">
                    <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="font-bold text-slate-900 text-base sm:text-lg">Lịch sử Hoạt động Đi tuyến</h2>
                        <p class="text-xs sm:text-sm text-slate-500 mt-1">Danh sách các điểm bán đã hoàn tất Check-in và Check-out.</p>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[600px]">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-600 text-xs uppercase font-semibold border-b">
                                        <th class="p-3.5">Thời gian</th>
                                        <th class="p-3.5">Sale</th>
                                        <th class="p-3.5">Cửa hàng</th>
                                        <th class="p-3.5">Địa chỉ</th>
                                        <th class="p-3.5">Ghi chú & Ảnh</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y text-xs sm:text-sm">
                                    ${db.history.length === 0 ? `<tr><td colspan="5" class="p-8 text-center text-slate-400 italic">Chưa có lịch sử đi tuyến nào.</td></tr>` : ''}
                                    ${db.history.map(h => `
                                        <tr>
                                            <td class="p-3.5 text-xs text-slate-600 whitespace-nowrap">${h.time}</td>
                                            <td class="p-3.5 font-semibold text-amber-600">@${h.username}</td>
                                            <td class="p-3.5 font-bold text-slate-800">${h.storeName}</td>
                                            <td class="p-3.5 text-xs text-slate-600">${h.address}</td>
                                            <td class="p-3.5 space-y-1">
                                                <div class="text-xs text-slate-700">${h.note}</div>
                                                ${h.photo ? `<img src="${h.photo}" class="w-20 h-12 object-cover rounded border" />` : ''}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- ADMIN VIEW ---
        function renderAdminView() {
            const pendingUsers = db.users.filter(x => x.status === 'pending');
            const approvedUsers = db.users.filter(x => x.status === 'approved');

            return `
                <div class="space-y-4 sm:space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                        <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                            <h3 class="font-bold text-slate-900 text-base flex items-center space-x-2">
                                <i class="fa-solid fa-sliders text-amber-600"></i>
                                <span>Cài đặt hệ thống</span>
                            </h3>
                            <div class="space-y-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Bán kính cho phép Check-in (mét)</label>
                                    <input type="number" id="setting-radius" value="${db.settings.checkinRadius}" class="w-full px-4 py-2.5 rounded-xl border text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Thời gian bắt buộc ở điểm (Phút)</label>
                                    <input type="number" id="setting-minutes" value="${db.settings.requiredMinutes}" class="w-full px-4 py-2.5 rounded-xl border text-sm">
                                </div>
                                <button onclick="saveSettings()" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl text-xs sm:text-sm transition">Lưu cấu hình</button>
                            </div>
                        </div>

                        <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                            <h3 class="font-bold text-slate-900 text-base flex items-center space-x-2">
                                <i class="fa-solid fa-user-check text-amber-600"></i>
                                <span>Phê duyệt nhân viên (${pendingUsers.length})</span>
                            </h3>
                            <div class="space-y-2 max-h-[220px] overflow-y-auto">
                                ${pendingUsers.length === 0 ? `<p class="text-xs text-slate-400 italic">Không có tài khoản chờ duyệt.</p>` : ''}
                                ${pendingUsers.map(u => `
                                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border text-xs gap-2">
                                        <span><b>${u.fullname}</b> (@${u.username})</span>
                                        <div class="space-x-1 flex-shrink-0">
                                            <button onclick="approveUser('${u.username}')" class="px-2.5 py-1 bg-emerald-600 text-white rounded font-semibold">Duyệt</button>
                                            <button onclick="rejectUser('${u.username}')" class="px-2.5 py-1 bg-rose-50 text-rose-600 rounded font-semibold">Từ chối</button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- CAMERA & CHECK-IN WORKFLOW ---
        function openCheckinModal(storeId) {
            const store = db.stores.find(s => s.id === storeId);
            const distance = calculateDistance(currentLivePos.lat, currentLivePos.lng, store.lat, store.lng);
            if (distance > db.settings.checkinRadius) {
                alert(`Bạn đang ở cách cửa hàng ${Math.round(distance)}m. Vui lòng tiến lại gần trong vòng ${db.settings.checkinRadius}m để check-in!`);
                return;
            }
            activeCheckinStoreId = storeId;
            capturedImageData = null;
            document.getElementById('photo-modal').classList.remove('hidden');
            document.getElementById('photo-preview-container').classList.add('hidden');
            document.getElementById('camera-stream').classList.remove('hidden');
            document.getElementById('btn-capture').classList.remove('hidden');
            document.getElementById('btn-retake').classList.add('hidden');
            document.getElementById('btn-submit-checkin').disabled = true;
            document.getElementById('btn-submit-checkin').classList.add('opacity-50', 'cursor-not-allowed');
            startCamera();
        }

        function closePhotoModal() {
            document.getElementById('photo-modal').classList.add('hidden');
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function startCamera() {
            const video = document.getElementById('camera-stream');
            document.getElementById('camera-placeholder').innerText = 'Đang bật camera...';
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
                .then(stream => {
                    mediaStream = stream;
                    video.srcObject = stream;
                    document.getElementById('camera-placeholder').innerText = '';
                })
                .catch(() => {
                    document.getElementById('camera-placeholder').innerText = 'Không thể truy cập camera. Vui lòng cấp quyền!';
                });
        }

        function capturePhoto() {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('camera-canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            capturedImageData = canvas.toDataURL('image/png');

            document.getElementById('photo-preview').src = capturedImageData;
            document.getElementById('photo-preview-container').classList.remove('hidden');
            video.classList.add('hidden');
            document.getElementById('btn-capture').classList.add('hidden');
            document.getElementById('btn-retake').classList.remove('hidden');
            document.getElementById('btn-submit-checkin').disabled = false;
            document.getElementById('btn-submit-checkin').classList.remove('opacity-50', 'cursor-not-allowed');

            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        function confirmCheckin() {
            if (!activeCheckinStoreId || !capturedImageData) return;
            const store = db.stores.find(s => s.id === activeCheckinStoreId);
            const noteText = document.getElementById('checkin-note').value.trim() || 'Đang làm việc tại cửa hàng.';
            if (store) {
                store.checkinTime = Date.now();
                store.note = noteText;
                store.photo = capturedImageData;
                saveData();
                alert(`Check-in thành công! Bạn cần ở lại đủ ${db.settings.requiredMinutes} phút trước khi Check-out.`);
                closePhotoModal();
                render();
            }
        }

        function doCheckout(storeId) {
            const store = db.stores.find(s => s.id === storeId);
            const user = getCurrentUser();
            if (!store || !store.checkinTime) return;

            const elapsedMinutes = Math.floor((Date.now() - store.checkinTime) / 60000);
            if (elapsedMinutes < db.settings.requiredMinutes) {
                alert(`Chưa đủ thời gian! Bạn mới ở điểm bán ${elapsedMinutes} phút (Yêu cầu tối thiểu ${db.settings.requiredMinutes} phút).`);
                return;
            }

            store.visited = true;
            db.history.unshift({
                time: new Date().toLocaleString('vi-VN'),
                username: user.username,
                storeName: store.name,
                address: `${store.address}, ${store.district}`,
                note: store.note,
                photo: store.photo
            });
            saveData();
            alert('Check-out thành công! Hoạt động đã được lưu vào lịch sử.');
            render();
        }

        // --- ADMIN THÊM ĐIỂM BÁN THỦ CÔNG / GPS ---
        function openAdminAddStoreModal() {
            document.getElementById('store-lat').value = currentLivePos.lat;
            document.getElementById('store-lng').value = currentLivePos.lng;
            document.getElementById('add-store-modal').classList.remove('hidden');
        }

        function autoFillCurrentGPS() {
            document.getElementById('store-lat').value = currentLivePos.lat;
            document.getElementById('store-lng').value = currentLivePos.lng;
            alert(`Đã nạp tọa độ GPS: [${currentLivePos.lat}, ${currentLivePos.lng}]`);
        }

        function handleAdminAddStore(e) {
            e.preventDefault();
            const name = document.getElementById('store-name').value.trim();
            const owner = document.getElementById('store-owner').value.trim();
            const phone = document.getElementById('store-phone').value.trim();
            const city = document.getElementById('store-city').value.trim();
            const district = document.getElementById('store-district').value.trim();
            const address = document.getElementById('store-address').value.trim();
            const lat = parseFloat(document.getElementById('store-lat').value);
            const lng = parseFloat(document.getElementById('store-lng').value);

            db.stores.push({
                id: Date.now(), name, owner, phone, city, district, address, lat, lng,
                visited: false, note: '', photo: '', checkinTime: null
            });
            saveData();
            alert('Thêm điểm bán mới thành công!');
            document.getElementById('add-store-modal').classList.add('hidden');
            render();
        }

        // --- GPS & ACTIONS ---
        function requestUserGPS() {
            if (navigator.geolocation) {
                const btnText = document.getElementById('gps-btn-text');
                if(btnText) btnText.innerText = 'Đang lấy...';
                
                navigator.geolocation.getCurrentPosition(p => {
                    currentLivePos = { lat: p.coords.latitude, lng: p.coords.longitude };
                    if(btnText) btnText.innerText = 'Đã lấy GPS';
                    alert(`Cập nhật GPS thành công!\nTọa độ: ${currentLivePos.lat.toFixed(4)}, ${currentLivePos.lng.toFixed(4)}`);
                    render();
                }, () => {
                    alert('Không thể lấy vị trí. Vui lòng cấp quyền GPS trên trình duyệt điện thoại.');
                    if(btnText) btnText.innerText = 'Lỗi GPS';
                }, { enableHighAccuracy: true });
            } else {
                alert('Trình duyệt không hỗ trợ GPS.');
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function navigateGoogleMaps(lat, lng) {
            window.open(`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`, '_blank');
        }

        function deleteStore(id) {
            if(confirm('Bạn có chắc chắn muốn xóa điểm bán này không?')) {
                db.stores = db.stores.filter(s => s.id !== id);
                saveData(); render();
            }
        }

        function saveSettings() {
            const r = parseInt(document.getElementById('setting-radius').value);
            const m = parseInt(document.getElementById('setting-minutes').value);
            if(r > 0 && m >= 0) {
                db.settings.checkinRadius = r;
                db.settings.requiredMinutes = m;
                saveData();
                alert('Đã lưu cấu hình!');
            }
        }

        function approveUser(u) { db.users.find(x=>x.username===u).status='approved'; saveData(); render(); }
        function rejectUser(u) { db.users = db.users.filter(x=>x.username!==u); saveData(); render(); }
        function deleteUser(u) { if(confirm(`Xóa tài khoản @${u}?`)) { db.users = db.users.filter(x=>x.username!==u); saveData(); render(); } }

        // Khởi chạy ứng dụng
        render();
    </script>
</body>
</html>
